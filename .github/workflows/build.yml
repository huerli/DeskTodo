name: build

# 触发条件：推送 v* 标签，或在 Actions 页面手动点 “Run workflow”
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # 创建 Release 需要
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            rust-targets: "aarch64-apple-darwin"
            name: macos-arm64
          - platform: macos-latest # Intel（在 ARM runner 上交叉编译）
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            rust-targets: "x86_64-apple-darwin"
            name: macos-x64
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb"
            rust-targets: ""
            name: linux-x64
          - platform: windows-latest
            args: "--bundles nsis,msi"
            rust-targets: ""
            name: windows-x64

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euxo pipefail
          sudo apt-get update
          # -------------------- 自证版本：日志里会打印下面这行 --------------------
          echo "DEPFIX-VERSION=2 (仅 libayatana-appindicator3-dev；若看到 libappindicator3-dev 说明用的是旧版工作流)"
          # 注意：Tauri v2 用 libayatana-appindicator3-dev。
          # 不要同时装 libappindicator3-dev —— Ubuntu 22.04 上两者互相 Conflicts。
          # --no-install-recommends：避免推荐依赖把互斥包拖进来。
          # 先装基础依赖，libxdo-dev 单独装，便于出问题时定位到具体是哪个包。
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl wget file pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
          sudo apt-get install -y --no-install-recommends libxdo-dev

      - name: 确认 Linux 依赖已装上
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -e
          # 互斥包检查：这两个绝不能同时存在
          for pkg in libappindicator3-dev libappindicator3-1; do
            if dpkg -s "$pkg" >/dev/null 2>&1; then
              echo "  ✗ 检测到互斥包 $pkg，与 libayatana-appindicator3-dev 冲突"
              exit 1
            fi
          done
          echo "  ✓ 未安装互斥的 libappindicator3-dev / libappindicator3-1"
          for pkg in libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev; do
            if dpkg -s "$pkg" >/dev/null 2>&1; then
              echo "  ✓ $pkg"
            else
              echo "  ✗ $pkg 未安装"
              exit 1
            fi
          done
          pkg-config --modversion webkit2gtk-4.1 | sed 's/^/  webkit2gtk-4.1 版本: /'

      - name: 诊断（仅在依赖步骤失败时输出）— 谁拉进了冲突包
        if: failure() && matrix.platform == 'ubuntu-22.04'
        run: |
          echo "=== 谁依赖/推荐 libappindicator3-dev ==="
          apt-cache rdepends --installed libappindicator3-dev 2>/dev/null || true
          echo "=== 谁依赖 libappindicator3-1 ==="
          apt-cache rdepends --installed libappindicator3-1 2>/dev/null || true
          echo "=== 已安装的 appindicator 相关包 ==="
          dpkg -l | grep -i appindicator || echo "(无)"

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 前端是纯静态文件（src/），无需构建步骤；但先在打包前跑一遍自检，拦住回归
      - name: 编译并自检
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml
          cargo run --release --manifest-path src-tauri/Cargo.toml -- --self-test
        shell: bash

      - name: 构建并打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DeskTodo ${{ github.ref_name }}"
          releaseBody: "常驻桌面的待办小窗。下载对应平台安装包即可使用。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
