name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            name: macos-arm64
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            name: macos-x64
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb"
            name: linux-x64
          - platform: windows-latest
            args: "--bundles nsis,msi"
            name: windows-x64

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl wget file libxdo-dev libayatana-appindicator3-dev

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 前端是纯静态文件（src/），无需构建步骤
      - name: 构建并打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DeskTodo ${{ github.ref_name }}"
          releaseBody: "常驻桌面的待办小窗。下载对应平台安装包即可使用。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
