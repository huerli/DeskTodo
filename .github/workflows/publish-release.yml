name: publish-release

on:
  workflow_run:
    workflows: [build, recover-macos-arm64]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.name == 'recover-macos-arm64') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.head_branch, 'v') || github.event.workflow_run.name == 'recover-macos-arm64')
    runs-on: ubuntu-latest
    steps:
      - name: 验证全部平台制品并发布 Release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const recovering = run.name === 'recover-macos-arm64';
            let tag = run.head_branch;
            if (recovering) {
              // The installer was built from an existing tag. Read the tag from
              // the recovery run's attached release artifact name, rather than
              // assuming the current main branch still has the same version.
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner, repo, run_id: run.id, per_page: 100
              });
              const artifact = artifacts.find(item => item.name.startsWith('DeskTodo-macos-arm64-v'));
              if (!artifact) throw new Error('Recovery release tag artifact not found');
              tag = artifact.name.slice('DeskTodo-macos-arm64-'.length);
            }
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              throw new Error(`Invalid release tag: ${tag}`);
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, filter: 'latest', per_page: 100
            });
            let originalJobs = jobs;
            if (recovering) {
              const builds = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'build.yml', branch: tag, event: 'push', per_page: 10
              });
              const original = builds.data.workflow_runs.find(item => item.head_branch === tag);
              if (!original) throw new Error(`Original tag build not found: ${tag}`);
              originalJobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: original.id, filter: 'latest', per_page: 100
              });
            }
            for (const platform of ['windows-x64', 'linux-x64', 'macos-arm64', 'macos-x64']) {
              const platformJobs = recovering && platform !== 'macos-arm64' ? originalJobs : jobs;
              if (!platformJobs.some(job => job.name === platform && job.conclusion === 'success')) {
                throw new Error(`Missing successful build: ${platform}`);
              }
            }
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const release = releases.find(item => item.tag_name === tag);
            if (!release) throw new Error(`Release draft not found: ${tag}`);
            const names = release.assets.filter(asset => asset.size > 0).map(asset => asset.name);
            for (const extension of ['.dmg', '.deb', '.AppImage', '.msi', '.exe']) {
              if (!names.some(name => name.endsWith(extension))) {
                throw new Error(`Missing release asset: ${extension}`);
              }
            }
            for (const arch of ['aarch64', 'x64']) {
              if (!names.some(name => name.endsWith('.dmg') && name.includes(arch))) {
                throw new Error(`Missing macOS installer: ${arch}`);
              }
            }
            if (!release.draft) {
              core.info(`Release already published: ${release.html_url}`);
              return;
            }
            const notes = await github.rest.repos.generateReleaseNotes({ owner, repo, tag_name: tag });
            const fixes = tag === 'v0.1.3'
              ? '修复 Windows SSH 主机密钥扫描兼容问题，支持 ED25519、ECDSA、RSA 主机密钥，并消除 SSH 与 Git 后台命令的控制台弹窗。\n\n'
              : '';
            const published = await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id,
              name: `DeskTodo ${tag}`,
              body: `${fixes}下载对应平台安装包即可使用。\n\n${notes.data.body}`,
              draft: false, prerelease: false, make_latest: 'true'
            });
            core.info(`Published: ${published.data.html_url}`);
